<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ミルク  — 間（ま）</title>
<meta name="description" content="間（ま）第二十三作『ミルク』。いそがなくていい。まざるのは、あとで。" />
<style>
  :root { --bg:#0e0a07; --ink:#eadfce; --ink-dim:#766a58; --warm:#ffe3b6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.2rem,3.3vw,2.05rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.2s ease forwards;
    text-shadow:0 1px 26px rgba(10,7,4,0.9);
  }
  .poem p:nth-of-type(1){animation-delay:1.1s;}
  .poem p:nth-of-type(2){animation-delay:3.2s;}
  .poem p:nth-of-type(3){animation-delay:5.3s;}
  .poem p:nth-of-type(4){animation-delay:7.4s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--warm); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="ミルク">
    <div class="title">第二十三作　ミルク</div>
    <p>コーヒーに、ミルクをひとさじ。</p>
    <p>白が、茶色のなかで、ゆっくり渦をえがく。</p>
    <p>まざってしまえば、ただの一色。</p>
    <p>いそがなくていい。まざるのは、あとで。</p>
  </div>

  <nav class="bottom">
    <a href="22-shimo.html">← 前の作品</a>
    <a href="../index.html">間 →</a>
  </nav>

<script>
/*
 * ミルク — 温かいコーヒーに落としたミルクが、ゆっくり渦を描いていく。
 * 内側ほど速く、外へいくほど遅い（差動回転）から、一すじの白が、
 * ひとりでに渦を巻き、腕をのばし、やがて茶色のなかへほどけて消える。
 * まざってしまえば、ただの一色。だからこの、まざるまでの模様が「間」。
 * いそがなくていい。暖色をひとさじ。実際よりずっとゆっくり。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr,unit,cx,cy;
  let drops=[], pourT=0;

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
    unit=Math.min(w,h); cx=w*0.5; cy=h*0.5;
  }
  resize(); addEventListener('resize',resize);

  // ミルクが落ちる場所 — 中心から少しずれたところ
  function pourX(){ return cx + unit*0.17; }
  function pourY(){ return cy - unit*0.05; }

  function spawn(n){
    for(let i=0;i<n;i++){
      drops.push({
        x: pourX()+(Math.random()-0.5)*unit*0.012,
        y: pourY()+(Math.random()-0.5)*unit*0.012,
        r: unit*(0.007+Math.random()*0.007),
        a: 0.5+Math.random()*0.22,    // 白のこさ
        seed: Math.random()*6.283
      });
    }
  }

  // 渦の速度場 — 内ほど速く、外ほど遅い。ごくゆっくり外へにじむ。
  function advect(p,dt){
    let dx=p.x-cx, dy=p.y-cy;
    let r=Math.hypot(dx,dy)+1e-4;
    const omega = 0.95/(1 + r/(unit*0.12));   // 差動回転。内が速いほど腕が巻く
    // 接線方向（回す）
    p.x += -dy*omega*dt;
    p.y +=  dx*omega*dt;
    // ごくわずかに外へにじむ（拡散）
    const out = unit*0.005*dt;
    p.x += (dx/r)*out;
    p.y += (dy/r)*out;
    // かすかなゆらぎ
    p.seed += dt*0.5;
    p.x += Math.cos(p.seed)*unit*0.0010;
    p.y += Math.sin(p.seed*1.3)*unit*0.0010;
    // 広がるほど薄れ、ふくらむ（まざって名をなくす）
    p.r += unit*0.0038*dt;
    p.a *= (1 - 0.085*dt);
  }

  function backdrop(){
    ctx.fillStyle='#0e0a07'; ctx.fillRect(0,0,w,h);
    // コーヒーの表面 — 中心から縁へ沈む深い茶
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,unit*0.62);
    g.addColorStop(0,'#3a2412');
    g.addColorStop(0.55,'#271708');
    g.addColorStop(1,'#140d06');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    // 湯気まじりの、あたたかい照りを一さじ
    const hl=ctx.createRadialGradient(cx-unit*0.12,cy-unit*0.16,0,cx-unit*0.12,cy-unit*0.16,unit*0.5);
    hl.addColorStop(0,'rgba(255,214,150,0.10)');
    hl.addColorStop(1,'rgba(255,214,150,0)');
    ctx.fillStyle=hl; ctx.fillRect(0,0,w,h);
  }

  function vignette(){
    // カップの縁の気配 — ふちをそっと暗く落とす
    const v=ctx.createRadialGradient(cx,cy,unit*0.42,cx,cy,unit*0.66);
    v.addColorStop(0,'rgba(10,7,4,0)');
    v.addColorStop(1,'rgba(8,5,3,0.9)');
    ctx.fillStyle=v; ctx.fillRect(0,0,w,h);
  }

  function render(){
    backdrop();
    for(let i=0;i<drops.length;i++){
      const p=drops[i];
      if(p.a<=0.015) continue;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,'rgba(250,238,216,'+p.a+')');
      g.addColorStop(0.6,'rgba(238,220,190,'+(p.a*0.5)+')');
      g.addColorStop(1,'rgba(238,220,190,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    vignette();
  }

  function step(dt){
    // 最初の数秒だけ、ひとさじ分を細く落としつづける
    pourT+=dt;
    if(pourT<4.5) spawn(3);
    for(let i=drops.length-1;i>=0;i--){
      advect(drops[i],dt);
      if(drops[i].a<=0.015 || drops[i].r>unit*0.5) drops.splice(i,1);
    }
  }

  if(reduce){
    // 動きを止める設定なら、渦が描かれたひと時を、静かに一枚だけ置く。
    for(let k=0;k<420;k++) step(0.03);
    render();
  } else {
    let last=performance.now();
    function loop(now){
      const dt=Math.min((now-last)/1000,0.05); last=now;
      step(dt);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
