<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ろうそく  — 間（ま）</title>
<meta name="description" content="間（ま）第十五作『ろうそく』。消えそうでも、まだ、ともっている。" />
<style>
  :root { --bg:#0b0906; --ink:#ece0cd; --ink-dim:#6f6151; --warm:#ffd79a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.2rem,3.3vw,2.05rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.2s ease forwards;
    text-shadow:0 1px 24px rgba(6,4,2,0.7);
  }
  .poem p:nth-of-type(1){animation-delay:1.1s;}
  .poem p:nth-of-type(2){animation-delay:3.1s;}
  .poem p:nth-of-type(3){animation-delay:5.1s;}
  .poem p:nth-of-type(4){animation-delay:7.1s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--warm); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="ろうそく">
    <div class="title">第十五作　ろうそく</div>
    <p>火を、ひとつ、ともす。</p>
    <p>ほのおは、たえず揺れて、消えそうになって、</p>
    <p>でも、また、まっすぐ立ちなおる。</p>
    <p>小さくても、この暗さを、ちゃんとあたためている。</p>
  </div>

  <nav class="bottom">
    <a href="14-komorebi.html">← 前の作品</a>
    <a href="../index.html">間 →</a>
  </nav>

<script>
/*
 * ろうそく — 暗い部屋に、火をひとつ。
 * ほのおは、ひとときも同じ形でいない。たえまなく揺れ、細くなり、
 * ときどき、ふっと消えそうになる。けれど、消えない。
 * また、まっすぐ立ちなおって、まわりのやみを、そっと押しかえす。
 * 急がない。ただ、この小さなあかりが、生きているのを見ている。
 * 消えそうでも、まだ、ともっている。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr,S;

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
    S=Math.min(w,h);
  }
  resize(); addEventListener('resize',resize);

  // ほのおの根もと。テキストにかからないよう、少し右に置く。
  const baseX=()=> w*0.70, baseY=()=> h*0.66;

  // 揺らぎ — 幾重かのゆっくりした波を重ねて、生きているような、
  // 予測できない小さな動きをつくる。ときどき、ふっと弱まる「息」も。
  function flick(t){
    const wobble = Math.sin(t*2.3)*0.5 + Math.sin(t*3.7+1.1)*0.3 + Math.sin(t*6.1+0.4)*0.2;
    // ゆっくりした呼吸。まれに深く沈んで、消えそうになる。
    const breath = Math.sin(t*0.5)*0.5 + Math.sin(t*0.19+2.0)*0.5;
    const dip = Math.max(0, Math.sin(t*0.23+1.7));      // 0〜1、たまに高くなる
    const faint = 1 - dip*dip*0.55;                     // ときどき ふっと細く暗く
    return {
      lean: wobble*0.9,                                 // 左右のかたむき
      height: 1 + breath*0.10,                          // 背の伸び縮み
      bright: (0.82 + breath*0.10) * faint,             // 明るさ
      faint: faint
    };
  }

  // ひとつのしずく型のほのおを、根もと(bx,by)から積む。
  function flamePath(bx,by,height,width,lean,t){
    ctx.beginPath();
    const N=22;
    const pts=[];
    for(let i=0;i<=N;i++){
      const u=i/N;                                      // 0=根もと 1=先
      // 中心線 — 上ほど大きく傾き、先ほど細かく揺れる
      const cx=bx + lean*Math.pow(u,1.5)*width*3.4
                 + Math.sin(t*4.0+u*3.0)*width*0.6*u;
      const cy=by - u*height;
      // 幅 — 根もとは丸く、中ほどでふくらみ、先はとがる（しずく型）
      const hw=width*Math.pow(Math.sin(Math.PI*Math.min(u*1.12,1)),0.72);
      pts.push([cx,cy,hw]);
    }
    // 右がわを上へ
    ctx.moveTo(pts[0][0]+pts[0][2], pts[0][1]);
    for(let i=1;i<=N;i++) ctx.lineTo(pts[i][0]+pts[i][2], pts[i][1]);
    // 左がわを下へ
    for(let i=N;i>=0;i--) ctx.lineTo(pts[i][0]-pts[i][2], pts[i][1]);
    ctx.closePath();
  }

  // のぼる火の粉。ごくまれに、ほのおの先から、ひとつ、ふたつ。
  let sparks=[];
  function spawnSpark(bx,topY){
    sparks.push({ x:bx+(Math.random()-0.5)*S*0.012, y:topY,
      vy:-(0.10+Math.random()*0.12)*S, drift:(Math.random()-0.5)*S*0.05,
      life:0, max:1.6+Math.random()*1.4, r:(0.6+Math.random()*0.8)*dpr });
  }

  function frame(t){
    const bx=baseX(), by=baseY();
    const f=flick(t);
    const H=S*0.185*f.height;
    const W=S*0.028;

    // ── 下地 — 火だけがある、あたたかい闇 ──
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#0b0906'; ctx.fillRect(0,0,w,h);
    // 部屋にたまる、ほのかな光だまり（明るさに合わせて呼吸する）
    const pool=ctx.createRadialGradient(bx,by-H*0.35,0,bx,by-H*0.2,S*0.72);
    const pa=0.5*f.bright;
    pool.addColorStop(0,`rgba(90,52,20,${0.42*pa+0.10})`);
    pool.addColorStop(0.35,`rgba(48,28,12,${0.28*pa})`);
    pool.addColorStop(1,'rgba(11,9,6,0)');
    ctx.fillStyle=pool; ctx.fillRect(0,0,w,h);

    // 火のあかりは、重ねて足していく（加算）
    ctx.globalCompositeOperation='lighter';

    // ── ほのおを囲む、やわらかい暈（かさ） ──
    const halo=ctx.createRadialGradient(bx,by-H*0.5,0,bx,by-H*0.45,H*1.7);
    halo.addColorStop(0,`rgba(255,176,86,${0.20*f.bright})`);
    halo.addColorStop(0.5,`rgba(220,120,50,${0.06*f.bright})`);
    halo.addColorStop(1,'rgba(220,120,50,0)');
    ctx.fillStyle=halo; ctx.fillRect(0,0,w,h);

    // ── ほのお本体：外→内へ、三枚を重ねる ──
    // 外炎（ふくらんだ橙）
    flamePath(bx,by,H,W,f.lean,t);
    let g=ctx.createLinearGradient(bx,by,bx,by-H);
    g.addColorStop(0,`rgba(120,40,10,${0.30*f.bright})`);
    g.addColorStop(0.35,`rgba(240,120,30,${0.40*f.bright})`);
    g.addColorStop(0.8,`rgba(255,170,60,${0.34*f.bright})`);
    g.addColorStop(1,'rgba(255,190,90,0)');
    ctx.fillStyle=g; ctx.fill();

    // 中炎（あかるい黄）
    flamePath(bx,by+H*0.02,H*0.80,W*0.66,f.lean*0.9,t);
    g=ctx.createLinearGradient(bx,by,bx,by-H*0.8);
    g.addColorStop(0,`rgba(180,70,20,${0.30*f.bright})`);
    g.addColorStop(0.45,`rgba(255,200,90,${0.55*f.bright})`);
    g.addColorStop(1,`rgba(255,230,150,${0.10*f.bright})`);
    ctx.fillStyle=g; ctx.fill();

    // 芯（白に近い熱）
    flamePath(bx,by+H*0.03,H*0.52,W*0.34,f.lean*0.8,t);
    g=ctx.createLinearGradient(bx,by,bx,by-H*0.5);
    g.addColorStop(0,`rgba(120,120,150,${0.20*f.faint})`);   // 根もとに、ひとさじの青
    g.addColorStop(0.4,`rgba(255,240,200,${0.75*f.bright})`);
    g.addColorStop(1,`rgba(255,252,235,${0.55*f.bright})`);
    ctx.fillStyle=g; ctx.fill();

    // 芯の先の、いちばん熱い一点
    const tipY=by-H*0.30;
    const core=ctx.createRadialGradient(bx+f.lean*W*1.6,tipY,0,bx+f.lean*W*1.6,tipY,W*0.9);
    core.addColorStop(0,`rgba(255,250,230,${0.7*f.bright})`);
    core.addColorStop(1,'rgba(255,250,230,0)');
    ctx.fillStyle=core; ctx.beginPath();
    ctx.arc(bx+f.lean*W*1.6,tipY,W*0.9,0,7); ctx.fill();

    // 芯糸（ろうそくの芯）の、小さな赤い残り火
    const wick=ctx.createRadialGradient(bx,by,0,bx,by,W*0.5);
    wick.addColorStop(0,`rgba(255,120,50,${0.5})`);
    wick.addColorStop(1,'rgba(255,120,50,0)');
    ctx.fillStyle=wick; ctx.beginPath(); ctx.arc(bx,by,W*0.5,0,7); ctx.fill();

    // ── 火の粉 ──
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i]; const k=s.life/s.max;
      if(k>=1){ sparks.splice(i,1); continue; }
      const a=Math.sin(Math.min(k,1)*Math.PI)*0.7;
      const sg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2.2);
      sg.addColorStop(0,`rgba(255,190,110,${a})`);
      sg.addColorStop(1,'rgba(255,190,110,0)');
      ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*2.2,0,7); ctx.fill();
    }

    ctx.globalCompositeOperation='source-over';
  }

  let start=performance.now(), last=start, sparkAcc=0;
  function loop(now){
    const dt=Math.min((now-last)/1000,0.05); last=now;
    const t=(now-start)/1000;
    const f=flick(t);
    // 明るく、勢いのあるときだけ、まれに火の粉がのぼる
    sparkAcc+=dt;
    if(sparkAcc>0.5){ sparkAcc=0;
      if(f.bright>0.85 && Math.random()<0.35) spawnSpark(baseX(), baseY()-S*0.185*f.height);
    }
    for(const s of sparks){ s.life+=dt; s.y+=s.vy*dt*(1-s.life/s.max*0.4); s.x+=s.drift*dt; }
    frame(t);
    requestAnimationFrame(loop);
  }

  if(reduce){
    // 動きを止める設定なら、まっすぐ灯る一瞬を、一枚だけ静かに置く。
    frame(0.0);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
