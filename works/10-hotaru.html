<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蛍  — 間（ま）</title>
<meta name="description" content="間（ま）第十作『蛍』。光らない時間も、あなたのもの。" />
<style>
  :root { --bg:#070b08; --ink:#dfe6d8; --ink-dim:#63705d; --glow:#c7f0a0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.25rem,3.4vw,2.1rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.4s ease forwards;
  }
  .poem p:nth-of-type(1){animation-delay:1.4s;}
  .poem p:nth-of-type(2){animation-delay:3.8s;}
  .poem p:nth-of-type(3){animation-delay:6.2s;}
  .poem p:nth-of-type(4){animation-delay:8.6s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--glow); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="蛍">
    <div class="title">第十作　蛍</div>
    <p>草のあいだに、ひとつ、灯る。</p>
    <p>消えて、しばらくして、また、どこかで。</p>
    <p>明るさを、競わない。</p>
    <p>光らない時間も、あなたのもの。</p>
  </div>

  <nav class="bottom">
    <a href="09-mizukagami.html">← 前の作品</a>
    <a href="../index.html">間 →</a>
  </nav>

<script>
/*
 * 蛍 — 夏の夜、草むらの暗がり。
 * ぽつり、と、あたたかい黄緑の光がひとつ灯る。ゆっくり息をするように明滅し、
 * やがて消えて、しばらくの暗がりのあと、また離れたところで灯る。
 * 蛍たちは、ばらばらの間（ま）で光る。ひとつも灯らない、長い暗がりもある。
 * その「光らない時間」も、夜のうち。急がない。競わない。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr, flies=[];

  function build(){
    // 画面の広さに応じて、控えめな数だけ。多すぎない。
    const n=Math.max(7, Math.min(14, Math.round(innerWidth*innerHeight/90000)));
    flies=[];
    for(let i=0;i<n;i++){
      flies.push({
        // 草むらより少し上、画面の下 2/3 あたりを漂う
        bx:0.08+Math.random()*0.84,
        by:0.30+Math.random()*0.62,
        ax:(30+Math.random()*70),          // ゆるいさまよいの振れ幅（px）
        ay:(24+Math.random()*54),
        fx:0.05+Math.random()*0.06,        // さまよう速さ（とても遅い）
        fy:0.04+Math.random()*0.06,
        px:Math.random()*Math.PI*2,
        py:Math.random()*Math.PI*2,
        blinkW:0.5+Math.random()*0.5,      // 明滅の速さ
        blinkPh:Math.random()*Math.PI*2,
        envW:0.03+Math.random()*0.04,      // 現れては消える、長い波
        envPh:Math.random()*Math.PI*2,
        hue:Math.random()                   // わずかな色の個体差
      });
    }
  }

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  }
  resize(); build();
  addEventListener('resize',function(){ resize(); build(); });

  // 夜の下地 — 冷たく深い暗がりと、足もとの草のけはい
  function night(){
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#060907'; ctx.fillRect(0,0,w,h);
    const sky=ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'rgba(16,26,22,0.6)');
    sky.addColorStop(0.6,'rgba(8,13,10,0.25)');
    sky.addColorStop(1,'rgba(4,7,5,0)');
    ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
    // 足もと、草むらの深い影
    const ground=ctx.createLinearGradient(0,h,0,h*0.7);
    ground.addColorStop(0,'rgba(3,7,4,0.85)');
    ground.addColorStop(1,'rgba(3,7,4,0)');
    ctx.fillStyle=ground; ctx.fillRect(0,h*0.66,w,h*0.34);
  }

  // 一匹の蛍の、いまの明るさ（0→1）
  function brightness(f,t){
    // 鋭い山と、長い暗がりの谷 — 息をするような明滅
    let pulse=Math.max(0,Math.sin(t*f.blinkW+f.blinkPh));
    pulse=pulse*pulse*pulse*pulse*pulse*pulse;   // ^6：ほとんど暗く、ときどき灯る
    // さらにゆっくりした波で、現れては消える（ひとつも灯らない間もできる）
    let env=0.5+0.5*Math.sin(t*f.envW+f.envPh);
    env=Math.max(0, env-0.25)/0.75;              // ときどき完全に消える
    return pulse*env;
  }

  function drawFly(f,t){
    const b=brightness(f,t);
    if(b<=0.003) return;
    const x=(f.bx*innerWidth + Math.sin(t*f.fx+f.px)*f.ax)*dpr;
    const y=(f.by*innerHeight + Math.sin(t*f.fy+f.py)*f.ay)*dpr;
    // あたたかい黄緑。個体差で少しだけ黄による／緑による
    const r=Math.round(190+f.hue*40);
    const g=Math.round(232+ (1-f.hue)*18);
    const bl=Math.round(140+f.hue*30);
    // やわらかい光の輪
    const rad=(20+18*b)*dpr;
    const halo=ctx.createRadialGradient(x,y,0,x,y,rad);
    halo.addColorStop(0,'rgba('+r+','+g+','+bl+','+(0.55*b)+')');
    halo.addColorStop(0.4,'rgba('+r+','+g+','+bl+','+(0.16*b)+')');
    halo.addColorStop(1,'rgba('+r+','+g+','+bl+',0)');
    ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill();
    // ちいさな芯
    const core=ctx.createRadialGradient(x,y,0,x,y,3.2*dpr);
    core.addColorStop(0,'rgba(235,255,205,'+(0.9*b)+')');
    core.addColorStop(1,'rgba(235,255,205,0)');
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(x,y,3.2*dpr,0,7); ctx.fill();
  }

  const start=performance.now();
  function loop(now){
    const t=(now-start)/1000;
    night();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<flies.length;i++) drawFly(flies[i],t);
    ctx.globalCompositeOperation='source-over';
    if(!reduce) requestAnimationFrame(loop);
  }

  if(reduce){
    // 動きを止める設定なら、いくつかの蛍が灯った、夜の一瞬を静かに置く
    night();
    ctx.globalCompositeOperation='lighter';
    const fixed=[0.35,0,0.9,0,0.6,0,0.8];
    for(let i=0;i<flies.length;i++){
      const b=fixed[i%fixed.length];
      if(b<=0) continue;
      const f=flies[i];
      const x=(f.bx*innerWidth)*dpr, y=(f.by*innerHeight)*dpr;
      const rad=(20+18*b)*dpr;
      const halo=ctx.createRadialGradient(x,y,0,x,y,rad);
      halo.addColorStop(0,'rgba(200,238,150,'+(0.55*b)+')');
      halo.addColorStop(0.4,'rgba(200,238,150,'+(0.16*b)+')');
      halo.addColorStop(1,'rgba(200,238,150,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill();
      const core=ctx.createRadialGradient(x,y,0,x,y,3.2*dpr);
      core.addColorStop(0,'rgba(235,255,205,'+(0.9*b)+')');
      core.addColorStop(1,'rgba(235,255,205,0)');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(x,y,3.2*dpr,0,7); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
