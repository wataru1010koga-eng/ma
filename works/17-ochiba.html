<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>落ち葉  — 間（ま）</title>
<meta name="description" content="間（ま）第十七作『落ち葉』。落ちることも、まだ、途中。" />
<style>
  :root { --bg:#120d09; --ink:#ece0cf; --ink-dim:#7a6552; --warm:#ffcf8f; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.2rem,3.3vw,2.05rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.2s ease forwards;
    text-shadow:0 1px 26px rgba(10,7,4,0.85);
  }
  .poem p:nth-of-type(1){animation-delay:1.1s;}
  .poem p:nth-of-type(2){animation-delay:3.1s;}
  .poem p:nth-of-type(3){animation-delay:5.1s;}
  .poem p:nth-of-type(4){animation-delay:7.1s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--warm); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="落ち葉">
    <div class="title">第十七作　落ち葉</div>
    <p>枝から、そっと、手をはなした。</p>
    <p>落ちていく、その時間までも、</p>
    <p>右へ、左へ、風にあずけて。</p>
    <p>落ちることも、まだ、途中だから。</p>
  </div>

  <nav class="bottom">
    <a href="16-susuki.html">← 前の作品</a>
    <a href="../index.html">間 →</a>
  </nav>

<script>
/*
 * 落ち葉 — 秋の木から、一枚、また一枚と、葉がはなれて落ちていく。
 * まっすぐには落ちない。右へ左へ振り子のように揺れ、くるりと裏返り、
 * 空気に身をあずけながら、ゆっくりと降りてくる。
 * 落ちていく時間さえ、急がない。落ちることも、まだ、途中。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr,S,leaves=[];

  function rand(a,b){ return a+Math.random()*(b-a); }

  // 秋の色。くすんだ琥珀・錆・枯れ金・淡い茶。
  const palette=[
    [200,118,58],[184,85,46],[214,150,74],[168,100,47],[201,160,88],[150,88,52]
  ];

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
    S=Math.min(w,h);
    build();
  }

  // 一枚の葉をつくる。奥ほど小さく、淡く、ゆっくり。
  function makeLeaf(initial){
    const depth=Math.random();                 // 0=手前 1=奥
    const col=palette[(Math.random()*palette.length)|0];
    return {
      x:rand(-0.05,1.05)*w,
      y:initial ? rand(-0.1,1.05)*h : rand(-0.18,-0.02)*h,  // 最初は画面内に散らす
      depth,
      r:(11+18*(1-depth))*dpr,                 // 葉の大きさ
      vy:(9+18*(0.4+0.6*(1-depth)))*dpr,       // 落ちる速さ（秒あたり）。ゆっくり。
      swayAmp:rand(24,64)*dpr*(0.6+0.5*(1-depth)),
      swayFreq:rand(0.18,0.42),                // 振り子の周期（遅い）
      swayPhase:rand(0,Math.PI*2),
      rot:rand(0,Math.PI*2),
      rotSpeed:rand(-0.35,0.35),               // ゆるやかに回る
      flipFreq:rand(0.35,0.75),                // 裏返る速さ
      flipPhase:rand(0,Math.PI*2),
      col, alpha:0.30+0.65*(1-depth)
    };
  }

  function build(){
    const n=Math.round(12 + w/(70*dpr));       // 画面幅に応じてほどほどに
    leaves=[];
    for(let i=0;i<n;i++) leaves.push(makeLeaf(true));
    leaves.sort((a,b)=>b.depth-a.depth);       // 奥から描く
  }

  // 葉のかたち。両端のとがった木の葉。中央に一本の葉脈。
  function leafShape(r){
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.quadraticCurveTo(r*0.72,-r*0.15, 0, r);
    ctx.quadraticCurveTo(-r*0.72,-r*0.15, 0, -r);
    ctx.closePath();
  }

  function drawLeaf(l,t){
    const sway=Math.sin(t*l.swayFreq+l.swayPhase)*l.swayAmp;
    const flip=Math.cos(t*l.flipFreq+l.flipPhase);   // -1..1、0で真横（裏返る瞬間）
    const rot=l.rot + t*l.rotSpeed;
    ctx.save();
    ctx.translate(l.x+sway, l.y);
    ctx.rotate(rot);
    ctx.scale(flip, 1);                               // 空気を受けて、くるりと裏返る
    const c=l.col;
    // 表は明るく、裏（flipが負）はすこし沈んだ色に
    const face=flip>=0 ? 1 : 0.72;
    const g=ctx.createLinearGradient(0,-l.r,0,l.r);
    g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${l.alpha*face})`);
    g.addColorStop(1,`rgba(${c[0]*0.7|0},${c[1]*0.7|0},${c[2]*0.7|0},${l.alpha*face})`);
    leafShape(l.r);
    ctx.fillStyle=g; ctx.fill();
    // 葉脈
    ctx.beginPath();
    ctx.moveTo(0,-l.r*0.9); ctx.lineTo(0,l.r*0.9);
    ctx.strokeStyle=`rgba(${c[0]*0.55|0},${c[1]*0.5|0},${c[2]*0.5|0},${l.alpha*face*0.8})`;
    ctx.lineWidth=Math.max(0.6,l.r*0.05);
    ctx.stroke();
    ctx.restore();
  }

  function backdrop(){
    // 夕方の木の下。上は深く、下へ向かってわずかに暖かく明るむ。
    const sky=ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#0d0906');
    sky.addColorStop(0.55,'#140d08');
    sky.addColorStop(1,'#1c130b');
    ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
    // 低いところに、傾いた陽の、あたたかい光だまり。
    const glow=ctx.createRadialGradient(w*0.72,h*1.02,0,w*0.72,h*1.02,S*1.05);
    glow.addColorStop(0,'rgba(255,190,110,0.10)');
    glow.addColorStop(0.5,'rgba(230,150,80,0.035)');
    glow.addColorStop(1,'rgba(230,150,80,0)');
    ctx.fillStyle=glow; ctx.fillRect(0,0,w,h);
  }

  function frame(t){
    backdrop();
    for(const l of leaves) drawLeaf(l,t);
  }

  let last=performance.now(), start=performance.now();
  function loop(now){
    const dt=Math.min((now-last)/1000,0.05); last=now;
    const t=(now-start)/1000;
    for(const l of leaves){
      l.y+=l.vy*dt;
      if(l.y-l.r > h+l.swayAmp){                 // 下まで落ちたら、また上から
        Object.assign(l, makeLeaf(false));
      }
    }
    frame(t);
    requestAnimationFrame(loop);
  }

  resize(); addEventListener('resize',resize);
  if(reduce){
    // 動きを止める設定なら、葉が舞い落ちる一瞬を、一枚だけ静かに置く。
    frame(3.2);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
