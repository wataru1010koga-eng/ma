<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>すすき  — 間（ま）</title>
<meta name="description" content="間（ま）第十六作『すすき』。揺れても、折れはしない。" />
<style>
  :root { --bg:#0c0e12; --ink:#e6e6dc; --ink-dim:#65685f; --warm:#f0e2c2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.2rem,3.3vw,2.05rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.2s ease forwards;
    text-shadow:0 1px 26px rgba(6,8,12,0.8);
  }
  .poem p:nth-of-type(1){animation-delay:1.1s;}
  .poem p:nth-of-type(2){animation-delay:3.1s;}
  .poem p:nth-of-type(3){animation-delay:5.1s;}
  .poem p:nth-of-type(4){animation-delay:7.1s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--warm); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="すすき">
    <div class="title">第十六作　すすき</div>
    <p>風が、野をひとつ、わたっていく。</p>
    <p>すすきは、みんな同じほうへ、しなって、</p>
    <p>風が過ぎれば、また、ゆっくり立つ。</p>
    <p>揺れても、いい。折れは、しないから。</p>
  </div>

  <nav class="bottom">
    <a href="15-rousoku.html">← 前の作品</a>
    <a href="../index.html">間 →</a>
  </nav>

<script>
/*
 * すすき — 秋の野。銀色の穂が、月あかりのなかで、いっせいに風にしなる。
 * 風はひとつの波になって野をわたり、穂は同じほうへかたむいて、
 * 過ぎれば、また、ゆっくりと立ちなおる。急がない。折れは、しない。
 * 揺れても、いい。ただ揺れているだけの、なんでもない時間。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr,S,stalks=[];

  function rand(a,b){ return a+Math.random()*(b-a); }

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
    S=Math.min(w,h);
    build();
  }

  // 野に生える穂を、手前から奥へ何列も。奥ほど淡く、細く、低く。
  function build(){
    stalks=[];
    const cols=Math.round(28 + w/(46*dpr));      // 画面幅に応じた本数
    for(let i=0;i<cols;i++){
      const depth=Math.random();                 // 0=手前 1=奥
      const x=rand(-0.04,1.04)*w;                 // 画面の外まで少しはみ出す
      const len=(0.30+0.30*(1-depth)+rand(-0.05,0.06))*h;  // 背たけ
      stalks.push({
        x, depth, len,
        baseY:h*rand(0.99,1.03),                  // 根もとは画面の下
        thick:(1.1+2.0*(1-depth))*dpr,            // 茎の太さ
        amp:rand(0.8,1.25)*(0.7+0.5*depth),       // 揺れやすさ（奥ほど大きく見える）
        phase:rand(0,Math.PI*2),                  // 個体差
        freq:rand(0.85,1.15),
        bright:0.35+0.65*(1-depth),               // 手前ほど明るい
        hairs:makeHairs(depth)
      });
    }
    // 奥のものから描くため、depthの大きい順に
    stalks.sort((a,b)=>b.depth-a.depth);
  }

  // 穂先の毛（ふさふさ）。上へ外へ、少し垂れる細い線を放射状に。
  function makeHairs(depth){
    const n=Math.round(rand(14,22));
    const arr=[];
    for(let i=0;i<n;i++){
      const side=i%2?1:-1;
      arr.push({
        ang:side*rand(0.05,0.85),               // 中心からの開き
        len:rand(0.45,1.0),                       // 相対長
        droop:rand(0.15,0.6),                     // 先の垂れ
        off:rand(0,1)                             // 付け根の高さ（穂のどこから出るか）
      });
    }
    return arr;
  }

  // 風 — ひとつの波が野をわたる。ときどき、ふっと強くなる。
  function windAt(t,x){
    const travel=Math.sin(t*0.32 - x*0.0055);              // 横切っていく波
    const ripple=Math.sin(t*0.85 - x*0.010 + 1.7)*0.35;    // 細かなさざなみ
    const gust=Math.sin(t*0.11)*0.55 + Math.sin(t*0.067+2.1)*0.45; // ゆっくりした息
    const strength=0.30+0.70*Math.max(0,gust);             // 0〜1、まれに強い
    return (travel*0.7 + ripple) * strength;
  }

  // 一本の穂を描く。根もと(x,baseY)から、風で傾けて、穂先に毛をつける。
  function drawStalk(s,t){
    const lean=windAt(t,s.x)*s.amp;              // −〜＋の傾き
    const N=14;
    const pts=[];
    for(let i=0;i<=N;i++){
      const u=i/N;                                // 0=根もと 1=穂先
      // 上ほど大きくしなる（根もとは動かない）
      const bend=Math.pow(u,1.7)*lean*s.len*0.42
                 + Math.sin(t*s.freq+s.phase+u*2.0)*s.len*0.02*u;
      pts.push([ s.x+bend, s.baseY-u*s.len, u ]);
    }
    const col=`230,232,224`;                      // 銀色がかった白
    // ── 茎 ── 先ほど細くなるように、塗りでテーパー
    ctx.beginPath();
    for(let i=0;i<=N;i++){ const hw=s.thick*(1-pts[i][2]*0.85);
      if(i===0) ctx.moveTo(pts[i][0]+hw,pts[i][1]); else ctx.lineTo(pts[i][0]+hw,pts[i][1]); }
    for(let i=N;i>=0;i--){ const hw=s.thick*(1-pts[i][2]*0.85); ctx.lineTo(pts[i][0]-hw,pts[i][1]); }
    ctx.closePath();
    ctx.fillStyle=`rgba(${col},${0.20*s.bright})`;
    ctx.fill();

    // ── 穂（毛） ── 穂先まわりから放射状に。加算でやわらかく光らせる。
    const tip=pts[N], neck=pts[Math.round(N*0.72)];
    const plume=s.len*0.34;                        // 穂の大きさ
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';
    for(const hr of s.hairs){
      // 付け根は、首から穂先のあいだのどこか
      const bx=neck[0]+(tip[0]-neck[0])*hr.off;
      const by=neck[1]+(tip[1]-neck[1])*hr.off;
      // 風になびく方向へ、少し寝かせる
      const dir=hr.ang + lean*0.5;
      const L=plume*hr.len;
      const ex=bx + Math.sin(dir)*L;
      const ey=by - Math.cos(dir)*L*(1-hr.droop*0.5); // 先は少し垂れる
      const cx=bx + Math.sin(dir)*L*0.5 + lean*L*0.15;
      const cy=by - Math.cos(dir)*L*0.5;
      ctx.beginPath();
      ctx.moveTo(bx,by);
      ctx.quadraticCurveTo(cx,cy,ex,ey);
      ctx.lineWidth=(0.6+0.5*(1-s.depth))*dpr;
      ctx.strokeStyle=`rgba(${col},${0.10*s.bright})`;
      ctx.stroke();
    }
    // 穂の中心の、ほのかな光だまり（月あかりを受ける銀）
    const g=ctx.createRadialGradient(tip[0],tip[1]-plume*0.35,0,tip[0],tip[1]-plume*0.35,plume*0.9);
    g.addColorStop(0,`rgba(240,240,230,${0.10*s.bright})`);
    g.addColorStop(1,'rgba(240,240,230,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(tip[0],tip[1]-plume*0.35,plume*0.9,0,7); ctx.fill();
    ctx.restore();
  }

  function backdrop(){
    // 夜の空 — 上は深く、地平にむかってわずかに明るむ。
    const sky=ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#0a0c10');
    sky.addColorStop(0.6,'#0d1016');
    sky.addColorStop(0.86,'#141a22');
    sky.addColorStop(1,'#0c0e12');
    ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
    // 地平のひくいところに、冷たく澄んだ月あかりの帯。
    const glow=ctx.createRadialGradient(w*0.62,h*0.82,0,w*0.62,h*0.82,S*0.95);
    glow.addColorStop(0,'rgba(150,168,190,0.10)');
    glow.addColorStop(0.5,'rgba(120,140,170,0.04)');
    glow.addColorStop(1,'rgba(120,140,170,0)');
    ctx.fillStyle=glow; ctx.fillRect(0,0,w,h);
  }

  function frame(t){
    backdrop();
    for(const s of stalks) drawStalk(s,t);
  }

  let start=performance.now();
  function loop(now){
    frame((now-start)/1000);
    requestAnimationFrame(loop);
  }

  resize(); addEventListener('resize',resize);
  if(reduce){
    // 動きを止める設定なら、風が野をわたる一瞬を、一枚だけ静かに置く。
    frame(4.5);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
