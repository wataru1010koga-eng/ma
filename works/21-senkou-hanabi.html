<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>線香花火  — 間（ま）</title>
<meta name="description" content="間（ま）第二十一作『線香花火』。まだ、落ちない。" />
<style>
  :root { --bg:#0b0a0d; --ink:#ece0ce; --ink-dim:#6f6557; --warm:#ffd49a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.2rem,3.3vw,2.05rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.4s ease forwards;
    text-shadow:0 1px 26px rgba(8,6,4,0.92);
  }
  .poem p:nth-of-type(1){animation-delay:1.2s;}
  .poem p:nth-of-type(2){animation-delay:3.4s;}
  .poem p:nth-of-type(3){animation-delay:5.6s;}
  .poem p:nth-of-type(4){animation-delay:7.8s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--warm); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="線香花火">
    <div class="title">第二十一作　線香花火</div>
    <p>ちいさな火の玉が、しずかにふるえている。</p>
    <p>そこから、金のはりが、いくつもこぼれ、</p>
    <p>枝わかれして、音もなく、暗がりへ還る。</p>
    <p>まだ、落ちない。</p>
  </div>

  <nav class="bottom">
    <a href="20-kumo.html">← 前の作品</a>
    <a href="22-shimo.html">次の作品 →</a>
  </nav>

<script>
/*
 * 線香花火 — こよりの先に垂れた、ちいさな火の玉。
 * そこから金色のはりがこぼれ、枝わかれ（松葉）して、
 * 音もなく、暗がりへ還っていく。実際よりずっとゆっくり。
 * 「間」は、消える手前のこの時間。終わりを知っていても、まだ、落ちない。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr,unit,cx,cy,sparks=[];
  const MAX=170;

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
    unit=Math.min(w,h);
    cx=w*0.5; cy=h*0.38;                       // 火の玉の垂れる位置
    ctx.fillStyle='#0b0a0d'; ctx.fillRect(0,0,w,h);   // 最初に一度、暗がりで塗る
  }
  resize(); addEventListener('resize',resize);

  function rand(a,b){ return a+Math.random()*(b-a); }

  // ひとつの火花。生まれ、少し飛んで、枝わかれして、やがて消える。
  function makeSpark(x,y,ang,spd,gen){
    return {
      x,y, px:x,py:y,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      life:0, max:rand(1.4,2.6)-gen*0.3,       // 世代が進むほど短命
      gen,
      branchAt:(gen<2)? rand(0.25,0.7) : 1e9,  // いちど枝わかれする頃合い
      flick:Math.random()*Math.PI*2
    };
  }

  function emit(x,y,ang,spd,gen){
    if(sparks.length<MAX) sparks.push(makeSpark(x,y,ang,spd,gen));
  }

  // 火の玉から、新しいはりを数本こぼす
  function sputter(n){
    for(let i=0;i<n;i++){
      const ang=rand(0,Math.PI*2);             // 全方向へ（重力でやがて垂れる）
      const spd=unit*rand(0.05,0.11);
      emit(cx+rand(-2,2)*dpr, cy+rand(-2,2)*dpr, ang, spd, 0);
    }
  }

  const grav=unit*0.055;                        // ごく弱い重力で、ゆっくり垂れる

  function stepSpark(s,dt){
    s.px=s.x; s.py=s.y;
    s.vy+=grav*dt;
    const drag=1-0.55*dt;                       // 空気にとけるように減速
    s.vx*=drag; s.vy*=drag;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    s.life+=dt;
    if(s.life>=s.branchAt){                      // 松葉 — ひとつが枝わかれする
      s.branchAt=1e9;
      const sp=Math.hypot(s.vx,s.vy)*rand(0.7,0.95);
      const base=Math.atan2(s.vy,s.vx);
      const k=2+(Math.random()<0.4?1:0);
      for(let j=0;j<k;j++){
        emit(s.x,s.y, base+rand(-0.7,0.7), sp*rand(0.8,1.15), s.gen+1);
      }
    }
  }

  function drawSpark(s){
    const k=s.life/s.max;                        // 0→1
    if(k>=1) return;
    const fade=Math.sin(Math.min(k,1)*Math.PI); // 生まれて明るく、やがて消える
    const fl=0.6+0.4*Math.sin(s.flick+s.life*22);// ちりちりと瞬く
    const a=Math.min(1,fade*fl);
    // 尾
    ctx.strokeStyle=`rgba(255,176,86,${a*0.6})`;
    ctx.lineWidth=(s.gen? 0.9:1.3)*dpr;
    ctx.beginPath(); ctx.moveTo(s.px,s.py); ctx.lineTo(s.x,s.y); ctx.stroke();
    // 先端の、ちいさな白金の点
    ctx.fillStyle=`rgba(255,240,214,${a})`;
    const r=(s.gen? 1.0:1.5)*dpr;
    ctx.beginPath(); ctx.arc(s.x,s.y,r,0,7); ctx.fill();
  }

  function drawBead(t){
    // 火の玉 — かすかにふるえ、脈打つ暖かい光
    const tr=1.3*dpr;
    const bx=cx+Math.sin(t*5.1)*tr, by=cy+Math.cos(t*4.3)*tr*0.8;
    const pulse=0.78+0.22*Math.sin(t*3.0);
    const halo=ctx.createRadialGradient(bx,by,0,bx,by,unit*0.12);
    halo.addColorStop(0,`rgba(255,150,70,${0.16*pulse})`);
    halo.addColorStop(1,'rgba(255,150,70,0)');
    ctx.fillStyle=halo; ctx.fillRect(0,0,w,h);
    const core=ctx.createRadialGradient(bx,by,0,bx,by,7*dpr*pulse);
    core.addColorStop(0,'rgba(255,245,222,0.95)');
    core.addColorStop(0.5,`rgba(255,196,118,${0.85*pulse})`);
    core.addColorStop(1,'rgba(255,150,70,0)');
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(bx,by,7*dpr*pulse,0,7); ctx.fill();
    return [bx,by];
  }

  function drawThread(bx,by){
    // こより — 火の玉を垂らす、ごく淡い一本
    const g=ctx.createLinearGradient(bx,0,bx,by);
    g.addColorStop(0,'rgba(120,96,70,0)');
    g.addColorStop(1,'rgba(150,120,86,0.22)');
    ctx.strokeStyle=g; ctx.lineWidth=1*dpr;
    ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx,by); ctx.stroke();
  }

  let last=performance.now(), start=last, acc=0;
  function loop(now){
    const dt=Math.min((now-last)/1000,0.05); last=now;
    const t=(now-start)/1000;

    // 暗がりで薄く塗りかさねる → 火花が尾をひいて、ゆっくり消えていく
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(11,10,13,0.16)';
    ctx.fillRect(0,0,w,h);

    ctx.globalCompositeOperation='lighter';
    const [bx,by]=drawBead(t);

    acc+=dt;
    if(acc>0.14){ acc=0; sputter(1+(Math.random()<0.5?1:0)); }

    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      stepSpark(s,dt);
      if(s.life>=s.max){ sparks.splice(i,1); continue; }
      drawSpark(s);
    }

    ctx.globalCompositeOperation='source-over';
    drawThread(bx,by);

    requestAnimationFrame(loop);
  }

  if(reduce){
    // 動きを止める設定なら、はりがこぼれる一瞬を、静かに一枚だけ置く。
    ctx.globalCompositeOperation='lighter';
    const [bx,by]=drawBead(0.4);
    for(let i=0;i<26;i++){
      const ang=rand(0,Math.PI*2), spd=unit*rand(0.05,0.11);
      const s=makeSpark(cx,cy,ang,spd,0);
      const steps=8+Math.floor(Math.random()*10);
      for(let n=0;n<steps;n++){ stepSpark(s,0.05); drawSpark(s); }
    }
    ctx.globalCompositeOperation='source-over';
    drawThread(bx,by);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
