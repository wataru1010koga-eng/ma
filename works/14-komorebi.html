<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>木漏れ日  — 間（ま）</title>
<meta name="description" content="間（ま）第十四作『木漏れ日』。揺れていても、光は、ちゃんと届く。" />
<style>
  :root { --bg:#0c0f0a; --ink:#ece6d5; --ink-dim:#6c6a56; --warm:#f6e7b6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.2rem,3.3vw,2.05rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.2s ease forwards;
    text-shadow:0 1px 22px rgba(8,10,6,0.6);
  }
  .poem p:nth-of-type(1){animation-delay:1.1s;}
  .poem p:nth-of-type(2){animation-delay:3.1s;}
  .poem p:nth-of-type(3){animation-delay:5.1s;}
  .poem p:nth-of-type(4){animation-delay:7.1s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--warm); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="木漏れ日">
    <div class="title">第十四作　木漏れ日</div>
    <p>葉のあいだから、光がこぼれてくる。</p>
    <p>地面に落ちた明るさが、そよ風のたびに、かたちを変える。</p>
    <p>つかまえようとすると、もう、となりへ移っている。</p>
    <p>揺れていても、光は、ちゃんと届いている。</p>
  </div>

  <nav class="bottom">
    <a href="13-shingou-machi.html">← 前の作品</a>
    <a href="15-rousoku.html">次の作品 →</a>
  </nav>

<script>
/*
 * 木漏れ日 — 木の下に立って、見あげる。
 * 葉と葉のすきまから、あたたかい光がいくつもこぼれ落ちる。
 * そよ風が渡るたび、その明るいまだらは、ゆっくりかたちを変え、
 * となりへ、となりへと移っていく。つかまえようとすると、もういない。
 * でも、いなくなったわけじゃない。揺れていても、光はちゃんと届いている。
 * 急がない。ただ、明るさが呼吸しているのを、下から見あげている。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr;

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  }
  resize(); addEventListener('resize',resize);

  // こもれびの、明るいまだら。
  // それぞれに 居場所（bx,by）／大きさ／遅い呼吸の位相と速さ／少しの色みをもつ。
  // 呼吸で明るくなったり薄れたりし、そよ風でゆっくり居場所をずらす。
  let spots=[];
  function seed(){
    spots=[];
    const N=16;
    for(let i=0;i<N;i++){
      spots.push({
        bx:Math.random(), by:Math.random()*0.9+0.05,
        r:0.05+Math.random()*0.13,          // 画面比。大小まぜて
        ph:Math.random()*Math.PI*2,          // 呼吸の位相
        sp:0.05+Math.random()*0.09,          // 呼吸の速さ（ゆっくり）
        wob:Math.random()*Math.PI*2,         // 揺れの位相
        warm:Math.random()                   // 暖色よりか、少し澄んだほうか
      });
    }
  }
  seed();

  // そよ風 — 全体をゆっくり、右へ左へ、わずかに押す。ときどき、少し強く。
  function wind(t){
    return Math.sin(t*0.11)*0.9 + Math.sin(t*0.047+1.3)*0.6 + Math.sin(t*0.19+0.5)*0.25;
  }

  // 木の下の下地 — 深い緑がかった闇。上のほうに、葉のあいだのほのかな明るさ。
  function ground(){
    ctx.globalCompositeOperation='source-over';
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#12160e');
    g.addColorStop(0.5,'#0d100a');
    g.addColorStop(1,'#080a06');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    // 梢のあたりの、うっすらとした空あかり
    const top=ctx.createRadialGradient(w*0.5,-h*0.15,0,w*0.5,-h*0.15,h*0.95);
    top.addColorStop(0,'rgba(200,196,150,0.10)');
    top.addColorStop(1,'rgba(200,196,150,0)');
    ctx.fillStyle=top; ctx.fillRect(0,0,w,h);
  }

  function drawSpot(s,t){
    const gust=wind(t);
    // 呼吸で明るさが行き来する。0.0〜1.0あたり。
    const br=(Math.sin(t*s.sp+s.ph)*0.5+0.5);
    if(br<=0.01) return;
    // そよ風で、ゆっくり居場所がずれる。上のほうほど、よく動く。
    const move=(1-s.by)*0.06;
    const x=(s.bx + gust*move + Math.sin(t*0.13+s.wob)*0.012) * w;
    const y=(s.by + Math.sin(t*0.09+s.wob*1.4)*0.010) * h;
    const r=s.r*Math.max(w,h)*(0.85+br*0.4);
    const a=br*br*0.16;                       // 明るさは控えめに。にじむ光。
    // あたたかい光を主に、ひとさじ澄んだ緑白を混ぜて
    const cr=246, cg=Math.round(224+ s.warm*8), cb=Math.round(150+ s.warm*40);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(${cr},${cg},${cb},${a})`);
    g.addColorStop(0.5,`rgba(${cr},${cg},${cb},${a*0.35})`);
    g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    // まん中に、ほんの小さな芯
    const cg2=ctx.createRadialGradient(x,y,0,x,y,r*0.28);
    cg2.addColorStop(0,`rgba(255,248,224,${a*0.9})`);
    cg2.addColorStop(1,'rgba(255,248,224,0)');
    ctx.fillStyle=cg2; ctx.beginPath(); ctx.arc(x,y,r*0.28,0,7); ctx.fill();
  }

  function frame(t){
    ground();
    ctx.globalCompositeOperation='lighter';
    for(const s of spots) drawSpot(s,t);
    ctx.globalCompositeOperation='source-over';
  }

  let start=performance.now();
  function loop(now){
    frame((now-start)/1000);
    if(!reduce) requestAnimationFrame(loop);
  }

  if(reduce){
    // 動きを止める設定なら、こもれびの一瞬を、一枚だけ静かに置く。
    frame(3.0);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
