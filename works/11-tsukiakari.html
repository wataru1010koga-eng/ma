<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月あかり  — 間（ま）</title>
<meta name="description" content="間（ま）第十一作『月あかり』。見えない間も、ちゃんとそこにいる。" />
<style>
  :root { --bg:#080b12; --ink:#dce3ec; --ink-dim:#5c6672; --glow:#e6edff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .poem {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start; gap:1.25em;
    padding:clamp(2rem,9vw,9rem); pointer-events:none;
  }
  .poem .title { font-size:clamp(1rem,2.4vw,1.4rem); letter-spacing:.25em; color:var(--ink-dim); margin-bottom:1.5em; }
  .poem p {
    font-size:clamp(1.25rem,3.4vw,2.1rem); line-height:2.05; letter-spacing:.06em;
    opacity:0; transform:translateY(10px); animation:in 3.2s ease forwards;
  }
  .poem p:nth-of-type(1){animation-delay:1.2s;}
  .poem p:nth-of-type(2){animation-delay:3.2s;}
  .poem p:nth-of-type(3){animation-delay:5.2s;}
  .poem p:nth-of-type(4){animation-delay:7.2s;}
  @keyframes in { to { opacity:1; transform:translateY(0); } }
  nav.top { position:fixed; top:clamp(1.2rem,4vw,2.4rem); left:clamp(1.5rem,5vw,4rem); z-index:5; }
  nav.top a { color:var(--glow); text-decoration:none; font-size:1.1rem; letter-spacing:.3em; opacity:.7; transition:opacity .4s; }
  nav.top a:hover { opacity:1; }
  nav.bottom { position:fixed; right:clamp(1.5rem,5vw,4rem); bottom:clamp(1.5rem,5vw,3rem); display:flex; gap:2em; font-size:.8rem; letter-spacing:.25em; }
  nav.bottom a { color:var(--ink-dim); text-decoration:none; transition:color .4s; }
  nav.bottom a:hover { color:var(--ink); }
  @media (prefers-reduced-motion:reduce){ .poem p{animation:none;opacity:1;transform:none;} }
</style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <nav class="top"><a href="../index.html" title="間 のトップへ">間</a></nav>

  <div class="poem" role="article" aria-label="月あかり">
    <div class="title">第十一作　月あかり</div>
    <p>雲が、月の前を、ゆっくり通っていく。</p>
    <p>しばらく、翳って、暗くなって、</p>
    <p>また、そっと、明るくなる。</p>
    <p>見えない間も、ちゃんとそこにいる。</p>
  </div>

  <nav class="bottom">
    <a href="10-hotaru.html">← 前の作品</a>
    <a href="../index.html">間 →</a>
  </nav>

<script>
/*
 * 月あかり — 夜ふけの空に、月がひとつ。
 * 薄い雲が、とてもゆっくり、月の前を横切っていく。
 * 通るあいだ、あかりは翳って暗くなり、雲がぬけると、また静かに戻ってくる。
 * 見えなくなる時間も、月は、ちゃんとそこにいる。急がない。
 */
(function(){
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr, clouds=[];

  // 月の位置（画面の右上あたり）
  const moon=()=>({ x:innerWidth*0.72, y:innerHeight*0.30, r:52 });

  function buildClouds(){
    clouds=[];
    // 高さ・速さの違う、いくつかの薄い雲。ゆっくり流れる。
    const n=6;
    for(let i=0;i<n;i++){
      const lumps=[];
      const parts=4+Math.floor(Math.random()*3);
      let ox=0;
      for(let j=0;j<parts;j++){
        lumps.push({
          dx:ox,
          dy:(Math.random()-0.5)*34,
          r:38+Math.random()*46
        });
        ox+=42+Math.random()*40;
      }
      clouds.push({
        cx:Math.random(),                     // 開始位置（0..1の割合）
        cy:0.10+Math.random()*0.46,           // 高さ
        speed:(3+Math.random()*7),            // px/秒。とても遅い
        scale:(0.7+Math.random()*0.9),
        alpha:(0.10+Math.random()*0.14),
        span:ox,
        lumps:lumps
      });
    }
  }

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.width=Math.floor(innerWidth*dpr);
    h=canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  }
  resize(); buildClouds();
  addEventListener('resize',function(){ resize(); });

  // 夜空の下地 — 冷たく澄んだ、深い青
  function sky(){
    ctx.globalCompositeOperation='source-over';
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#070a11');
    g.addColorStop(0.55,'#0a0e17');
    g.addColorStop(1,'#0c111b');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  }

  // 月とそのあかり
  function drawMoon(){
    const m=moon();
    const mx=m.x*dpr, my=m.y*dpr, r=m.r*dpr;
    // 広くにじむ、冷たい光
    const halo=ctx.createRadialGradient(mx,my,0,mx,my,r*7.5);
    halo.addColorStop(0,'rgba(226,236,255,0.30)');
    halo.addColorStop(0.14,'rgba(210,224,255,0.12)');
    halo.addColorStop(0.4,'rgba(180,200,240,0.04)');
    halo.addColorStop(1,'rgba(180,200,240,0)');
    ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(mx,my,r*7.5,0,7); ctx.fill();
    // 月本体
    const body=ctx.createRadialGradient(mx-r*0.2,my-r*0.2,0,mx,my,r);
    body.addColorStop(0,'rgba(245,249,255,0.95)');
    body.addColorStop(0.7,'rgba(224,233,252,0.85)');
    body.addColorStop(1,'rgba(200,214,240,0.5)');
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(mx,my,r,0,7); ctx.fill();
  }

  // 雲を一枚描く。x は現在の割合位置。
  function drawCloud(cl,xf){
    const baseX=(xf*1.6-0.3)*innerWidth;     // 画面の外から外へ流す
    const baseY=cl.cy*innerHeight;
    for(let k=0;k<cl.lumps.length;k++){
      const lp=cl.lumps[k];
      const x=(baseX+lp.dx*cl.scale)*dpr;
      const y=(baseY+lp.dy*cl.scale)*dpr;
      const r=lp.r*cl.scale*dpr;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(120,133,156,'+cl.alpha+')');
      g.addColorStop(0.55,'rgba(116,128,150,'+(cl.alpha*0.6)+')');
      g.addColorStop(1,'rgba(116,128,150,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
  }

  function wrap(v){ v=v%1; return v<0?v+1:v; }

  const start=performance.now();
  function loop(now){
    const t=(now-start)/1000;
    sky();
    drawMoon();
    // 雲は月のあかりの上を、そっと横切っていく
    for(let i=0;i<clouds.length;i++){
      const cl=clouds[i];
      const xf=wrap(cl.cx + (cl.speed*t)/(innerWidth*1.6));
      drawCloud(cl,xf);
    }
    if(!reduce) requestAnimationFrame(loop);
  }

  if(reduce){
    // 動きを止める設定なら、雲がひとひら月にかかった、夜の一瞬を静かに置く
    sky();
    drawMoon();
    for(let i=0;i<clouds.length;i++){
      const cl=clouds[i];
      drawCloud(cl, wrap(cl.cx));
    }
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
